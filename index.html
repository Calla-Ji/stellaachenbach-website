<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FEE6EA" />

    <!-- scripts/prerender-blog.mjs replaces the SEO:START..SEO:END block
         below with per-post title/description/canonical/OG/Twitter/JSON-LD
         for each generated dist/blog/<slug>/index.html. Everything else in
         this file (favicon, viewport, asset tags) is shared as-is. -->
    <!-- SEO:START -->
    <title>Stella Achenbach — Design Alchemist</title>
    <meta
      name="description"
      content="Stella Achenbach is a Design Alchemist working where 3D craft, game design, and decentralized systems overlap — tools, worlds, and systems for creators."
    />
    <link rel="canonical" href="https://stellaachenbach.com/" />

    <meta property="og:site_name" content="Stella Achenbach" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://stellaachenbach.com/" />
    <meta property="og:title" content="Stella Achenbach — Design Alchemist" />
    <meta
      property="og:description"
      content="Design Alchemist working where 3D craft, game design, and decentralized systems overlap — tools, worlds, and systems for creators."
    />
    <meta property="og:image" content="https://stellaachenbach.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stella Achenbach — Design Alchemist" />
    <meta
      name="twitter:description"
      content="Design Alchemist working where 3D craft, game design, and decentralized systems overlap — tools, worlds, and systems for creators."
    />
    <meta name="twitter:image" content="https://stellaachenbach.com/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Stella Achenbach",
        "url": "https://stellaachenbach.com",
        "jobTitle": "Design Alchemist",
        "description": "Design Alchemist working where 3D craft, game design, and decentralized systems overlap."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Stella Achenbach",
        "url": "https://stellaachenbach.com"
      }
    </script>
    <!-- SEO:END -->
  </head>
  <body>
    <!-- scripts/prerender-blog.mjs injects a brand-styled static snapshot
         of the post (category, title, hero image, body) between the
         PRERENDER:START/END markers below, for each generated file. React
         still fully replaces this on mount (main.jsx uses createRoot, not
         hydrateRoot) — it's purely for whatever sees the page before/
         without JS: crawlers, link-preview bots, slow connections. Left
         empty in the normal built index.html. -->
    <div id="root"><!-- PRERENDER:START --><!-- PRERENDER:END --></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
